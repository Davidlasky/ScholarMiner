{% extends "base.html" %}

{% block content %}
<div class="main-content">
    <div class="success-message">
        <p>Indexing completed successfully.</p>
        {% if task_result and task_result.num_terms is defined %}
        <p>The current index contains {{ task_result.num_terms }} terms.</p>
        {% endif %}
    </div>

    <h2>Please Select Action</h2>

    <div class="btn-group">
        <a href="{{ url_for('search_term') }}" class="btn btn-large">Search for Term</a>
        <a href="{{ url_for('top_n') }}" class="btn btn-large">Most Frequent Terms</a>
    </div>
</div>
{% endblock %}
